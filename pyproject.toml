[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aqp-agentsbench"
version = "0.1.0"
description = "Local, outcome-based benchmarks for coding agents"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aqp-bench = "aqp_bench.cli:main"

[tool.setuptools.packages.find]
include = ["aqp_bench*"]

[tool.setuptools.package-data]
aqp_bench = ["example/*.json", "example/*.csv", "example/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
